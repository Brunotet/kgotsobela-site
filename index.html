<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kgotsobela Consortium — Coming Soon</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    text-align: center;
    padding: 20px;
  }
  .box {
    max-width: 500px;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }
  p {
    color: #94a3b8;
    font-size: 1.1rem;
    margin-top: 0;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 8px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="box">
    <p><span class="dot"></span>Site under construction</p>
    <h1>Kgotsobela Consortium</h1>
    <p>Our new website is on the way. Check back soon.</p>
  </div>
</body>
</html>
